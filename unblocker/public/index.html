<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Jetstream</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="style.css" />
		<script src="/baremux/index.js" defer></script>
		<script src="/scram/scramjet.all.js" defer></script>
		<script src="app.js" defer></script>
	</head>
	<body>
		<main id="home">
			<div class="hero">
				<h1><span class="logo">✈</span> Jetstream</h1>
				<p class="tagline">Browse the open web, powered by Scramjet.</p>
				<form id="home-form" autocomplete="off">
					<input
						id="home-input"
						type="text"
						placeholder="Search or type a URL"
						spellcheck="false"
						autocapitalize="off"
						autofocus
					/>
					<button type="submit" aria-label="Go">→</button>
				</form>
				<p id="error" class="error" hidden></p>
				<div id="shortcuts" class="shortcuts"></div>
			</div>
			<button class="icon settings-btn" data-open-settings title="Settings">
				⚙
			</button>
		</main>

		<section id="browser" hidden>
			<nav class="toolbar">
				<button class="icon" id="btn-home" title="Home">⌂</button>
				<button class="icon" id="btn-back" title="Back">←</button>
				<button class="icon" id="btn-forward" title="Forward">→</button>
				<button class="icon" id="btn-reload" title="Reload">↻</button>
				<form id="bar-form" autocomplete="off">
					<input
						id="bar-input"
						type="text"
						spellcheck="false"
						autocapitalize="off"
					/>
				</form>
				<button class="icon" id="btn-newtab" title="Open in new tab">⧉</button>
				<button class="icon" id="btn-fullscreen" title="Fullscreen">⛶</button>
				<button class="icon" data-open-settings title="Settings">⚙</button>
			</nav>
			<div class="loading" id="loading"></div>
			<div id="frame-container"></div>
		</section>

		<dialog id="settings">
			<form method="dialog">
				<h2>Settings</h2>
				<label>
					Search engine
					<select id="opt-engine">
						<option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
						<option value="https://www.google.com/search?q=%s">Google</option>
						<option value="https://www.bing.com/search?q=%s">Bing</option>
						<option value="https://search.brave.com/search?q=%s">Brave</option>
					</select>
				</label>
				<label>
					Transport
					<select id="opt-transport">
						<option value="/epoxy/index.mjs">Epoxy</option>
						<option value="/libcurl/index.mjs">libcurl.js</option>
					</select>
				</label>
				<label>
					Wisp server
					<input id="opt-wisp" type="text" spellcheck="false" />
				</label>
				<div class="dialog-buttons">
					<button type="button" id="opt-reset" class="secondary">Reset</button>
					<button value="save">Save</button>
				</div>
			</form>
		</dialog>
	</body>
</html>
